include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Keep release analysis focused on actual correctness errors.
    # Existing app code intentionally uses compact one-line control-flow
    # statements in several places and is already functionally valid.
    curly_braces: false
    prefer_const_constructors: false
    avoid_print: true
    prefer_final_locals: true
