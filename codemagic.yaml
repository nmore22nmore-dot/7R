workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          set -e

          echo "===== N PROJECT ====="
          pwd
          ls -la

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Fix Android Gradle and Kotlin versions
        script: |
          set -e

          echo "===== FIXING ANDROID BUILD VERSIONS ====="

          # Android Gradle Plugin 8.11.1
          if [ -f android/settings.gradle ]; then
            sed -i.bak "s/id 'com.android.application' version '[0-9.]*'/id 'com.android.application' version '8.11.1'/g" android/settings.gradle
            sed -i.bak 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.11.1"/g' android/settings.gradle

            # Kotlin 2.2.20
            sed -i.bak "s/id 'org.jetbrains.kotlin.android' version '[0-9.]*'/id 'org.jetbrains.kotlin.android' version '2.2.20'/g" android/settings.gradle
            sed -i.bak 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' android/settings.gradle
          fi

          # Older Android projects
          if [ -f android/build.gradle ]; then
            sed -i.bak "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.11.1/g" android/build.gradle
            sed -i.bak "s/ext.kotlin_version = '[0-9.]*'/ext.kotlin_version = '2.2.20'/g" android/build.gradle
            sed -i.bak 's/ext.kotlin_version = "[0-9.]*"/ext.kotlin_version = "2.2.20"/g' android/build.gradle
          fi

          echo "===== ANDROID SETTINGS ====="
          cat android/settings.gradle

          echo "===== ROOT BUILD.GRADLE ====="
          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          fi

      - name: Verify versions
        script: |
          set -e

          echo "===== CHECK AGP ====="
          grep -R "8.11.1" android 2>/dev/null || true

          echo "===== CHECK KOTLIN ====="
          grep -R "2.2.20" android 2>/dev/null || true

          echo "===== GRADLE VERSION ====="
          cd android
          ./gradlew --version
          cd ..

      - name: Flutter packages
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Flutter analyze
        script: |
          set -e

          flutter analyze

      - name: Build APK
        script: |
          set -e

          echo "======================================"
          echo "BUILDING N RELEASE APK"
          echo "======================================"

          flutter build apk --release

      - name: Verify APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "N APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
