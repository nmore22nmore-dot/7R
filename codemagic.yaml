workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          set -e

          rm -rf android lib assets pubspec.yaml README.md
          rm -rf /tmp/n_final
          mkdir -p /tmp/n_final

          unzip -o N_FINAL_RELEASE_GRADLE_FIXED.zip -d /tmp/n_final

          cp -r /tmp/n_final/android .
          cp -r /tmp/n_final/lib .
          cp -r /tmp/n_final/assets .
          cp /tmp/n_final/pubspec.yaml .
          cp /tmp/n_final/README.md .

      - name: Fix Gradle configuration
        script: |
          set -e

          mkdir -p android/gradle/wrapper

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream {
                      properties.load(it)
                  }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.7.3" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          rootProject.name = "N"
          include ":app"
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

          cat > android/build.gradle <<'EOF'
          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Generate Gradle Wrapper
        script: |
          set -e

          cd android

          gradle wrapper --gradle-version 8.14.0

          chmod +x gradlew

          echo "===== GRADLE WRAPPER CREATED ====="
          ls -la gradlew
          ls -la gradle/wrapper/

          ./gradlew --version

          cd ..

      - name: Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Verify Android configuration
        script: |
          set -e

          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== gradle.properties ====="
          cat android/gradle.properties

          echo "===== Gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "===== Gradle version ====="
          cd android
          ./gradlew --version
          cd ..

      - name: Analyze Dart code
        script: |
          set -e
          flutter analyze

      - name: Build release APK
        script: |
          set -e
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
