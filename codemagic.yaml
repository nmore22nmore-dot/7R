workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare final project
        script: |
          set -e

          rm -rf android lib assets pubspec.yaml README.md
          rm -rf /tmp/n_final
          mkdir -p /tmp/n_final

          unzip -o N_FINAL_RELEASE_GRADLE_FIXED.zip -d /tmp/n_final

          cp -r /tmp/n_final/android .
          cp -r /tmp/n_final/lib .
          cp -r /tmp/n_final/assets .
          cp /tmp/n_final/pubspec.yaml .
          cp /tmp/n_final/README.md .

      - name: Fix Gradle repositories
        script: |
          set -e

          cat > android/build.gradle <<'EOF'
          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle")
          text = p.read_text()

          text = text.replace(
              "repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)",
              "repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)"
          )

          p.write_text(text)
          print("settings.gradle fixed")
          PY

      - name: Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Verify Gradle configuration
        script: |
          set -e

          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== gradle.properties ====="
          cat android/gradle.properties

          echo "===== android/build.gradle ====="
          cat android/build.gradle

      - name: Analyze Dart code
        script: |
          set -e
          flutter analyze

      - name: Build release APK
        script: |
          set -e
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
