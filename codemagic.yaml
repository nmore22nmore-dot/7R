workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          set -e

          echo "===== N PROJECT ====="
          pwd
          ls -la

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Fix Android versions
        script: |
          set -e

          echo "===== FIXING ANDROID VERSIONS ====="

          # AGP 8.11.1
          if [ -f android/settings.gradle ]; then
            sed -i.bak -E "s/(com\.android\.application.*version[[:space:]]*[\"']?)[0-9.]+/\18.11.1/g" android/settings.gradle

            # Kotlin 2.2.20
            sed -i.bak -E "s/(org\.jetbrains\.kotlin\.android.*version[[:space:]]*[\"']?)[0-9.]+/\12.2.20/g" android/settings.gradle
          fi

          # Older build.gradle projects
          if [ -f android/build.gradle ]; then
            sed -i.bak -E "s/(com\.android\.tools\.build:gradle:)[0-9.]+/\18.11.1/g" android/build.gradle
            sed -i.bak -E "s/(ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"']?)[0-9.]+/\12.2.20/g" android/build.gradle
          fi

          # Force compileSdk 36 safely.
          # Replace the entire compileSdk line instead of modifying part of it.
          if [ -f android/app/build.gradle ]; then
            sed -i.bak -E '/^[[:space:]]*compileSdk([[:space:]]*=[[:space:]]*|[[:space:]]+)[0-9.]+[[:space:]]*$/c\
            compileSdk = 36' android/app/build.gradle
          fi

          # Also repair any malformed compileSdk line left by a previous build.
          if [ -f android/app/build.gradle ]; then
            sed -i.bak -E 's/^[[:space:]]*compileSdk.*$/            compileSdk = 36/' android/app/build.gradle
          fi

          echo "===== FINAL compileSdk ====="
          grep -n "compileSdk" android/app/build.gradle || true

          echo "===== FINAL AGP/KOTLIN ====="
          grep -n "com.android.application\|org.jetbrains.kotlin.android" android/settings.gradle || true

      - name: Verify Android configuration
        script: |
          set -e

          echo "===== CHECKING compileSdk ====="

          if grep -q "compileSdk = 36" android/app/build.gradle; then
            echo "compileSdk 36 OK"
          else
            echo "ERROR: compileSdk 36 was not configured"
            exit 1
          fi

          if grep -q "compileSdk 36=" android/app/build.gradle; then
            echo "ERROR: malformed compileSdk detected"
            exit 1
          fi

          if grep -q "compileSdk.*=.*=" android/app/build.gradle; then
            echo "ERROR: malformed compileSdk assignment detected"
            exit 1
          fi

          echo "ANDROID CONFIGURATION OK"

      - name: Flutter packages
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Flutter analyze
        script: |
          set -e

          flutter analyze

      - name: Build APK
        script: |
          set -e

          echo "======================================"
          echo "BUILDING N RELEASE APK"
          echo "======================================"

          flutter build apk --release

      - name: Verify APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "N APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
