workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Verify project
        script: |
          set -e

          echo "===== N PROJECT ====="

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Flutter packages
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Flutter analyze
        script: |
          set -e

          flutter analyze

      - name: Build APK
        script: |
          set -e

          flutter build apk --release

      - name: Verify APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "===== N APK CREATED SUCCESSFULLY ====="
          ls -lh "$APK"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
