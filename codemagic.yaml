workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare final project
        script: |
          rm -rf android lib assets pubspec.yaml README.md
          mkdir -p /tmp/n_final
          unzip -o N_FINAL_RELEASE_ROOT_READY.zip -d /tmp/n_final
          cp -r /tmp/n_final/android .
          cp -r /tmp/n_final/lib .
          cp -r /tmp/n_final/assets .
          cp /tmp/n_final/pubspec.yaml .
          cp /tmp/n_final/README.md .

      - name: Flutter packages
        script: flutter pub get

      - name: Analyze Dart code
        script: flutter analyze

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
