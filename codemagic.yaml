workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Prepare Flutter project
        script: |
          set -e

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Fix Android Gradle Plugin
        script: |
          set -e

          echo "===== BEFORE AGP FIX ====="
          grep -R "com.android.application" android/settings.gradle android/build.gradle android/settings.gradle.kts 2>/dev/null || true

          # Upgrade Android Gradle Plugin to Flutter-supported version
          if [ -f android/settings.gradle ]; then
            sed -i.bak "s/com.android.application' version '[0-9.]*'/com.android.application' version '8.11.1'/g" android/settings.gradle
            sed -i.bak 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.11.1"/g' android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            sed -i.bak 's/id("com.android.application") version("[^"]*")/id("com.android.application") version("8.11.1")/g' android/settings.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            sed -i.bak "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.11.1/g" android/build.gradle
          fi

          echo "===== AFTER AGP FIX ====="
          grep -R "com.android.application" android/settings.gradle android/build.gradle android/settings.gradle.kts 2>/dev/null || true

      - name: Verify Gradle configuration
        script: |
          set -e

          echo "===== GRADLE VERSION ====="
          cd android
          ./gradlew --version
          cd ..

          echo "===== AGP CONFIGURATION ====="
          grep -R "8.11.1" android 2>/dev/null || true

      - name: Get Flutter packages
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Check Flutter
        script: |
          set -e
          flutter --version
          flutter doctor -v

      - name: Analyze Dart
        script: |
          set -e
          flutter analyze

      - name: Build release APK
        script: |
          set -e

          echo "===== BUILDING N RELEASE APK ====="

          flutter build apk --release

      - name: Verify APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "N APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
