workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          set -e

          rm -rf android
          rm -rf lib
          rm -rf assets
          rm -f pubspec.yaml
          rm -f README.md

          rm -rf /tmp/n_final
          mkdir -p /tmp/n_final

          unzip -o N_FINAL_RELEASE_GRADLE_FIXED.zip -d /tmp/n_final

          cp -r /tmp/n_final/android .
          cp -r /tmp/n_final/lib .
          cp -r /tmp/n_final/assets .
          cp /tmp/n_final/pubspec.yaml .
          cp /tmp/n_final/README.md .

      - name: Force correct Android Gradle configuration
        script: |
          set -e

          mkdir -p android/gradle/wrapper

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  def localPropertiesFile = file("local.properties")

                  if (!localPropertiesFile.exists()) {
                      throw new GradleException("local.properties is missing")
                  }

                  localPropertiesFile.withInputStream {
                      properties.load(it)
                  }

                  def flutterSdkPath = properties.getProperty("flutter.sdk")

                  if (flutterSdkPath == null) {
                      throw new GradleException("flutter.sdk not set in local.properties")
                  }

                  return flutterSdkPath
              }()

              includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.11.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          rootProject.name = "N"
          include ":app"
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

          cat > android/build.gradle <<'EOF'
          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.n.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.n.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          flutter {
              source "../.."
          }
          EOF

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "===== AGP ====="
          grep 'com.android.application' android/settings.gradle

          echo "===== GRADLE ====="
          grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties

      - name: Create Flutter local configuration
        script: |
          set -e

          flutter pub get

          echo "Flutter packages installed successfully."

      - name: Verify final configuration
        script: |
          set -e

          echo "===== SETTINGS ====="
          grep 'com.android.application' android/settings.gradle

          echo "===== APP BUILD ====="
          grep -A3 '^plugins' android/app/build.gradle

          echo "===== GRADLE PROPERTIES ====="
          cat android/gradle.properties

          echo "===== GRADLE WRAPPER ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "===== SEARCH FOR OLD AGP 8.7.3 ====="
          if grep -R "8.7.3" android --exclude-dir=.gradle; then
              echo "ERROR: OLD AGP 8.7.3 FOUND"
              exit 1
          fi

          echo "SUCCESS: AGP 8.7.3 NOT FOUND"

      - name: Analyze Dart code
        script: |
          set -e
          flutter analyze

      - name: Build release APK
        script: |
          set -e

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      - name: Verify APK
        script: |
          set -e

          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          echo "APK successfully created:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
