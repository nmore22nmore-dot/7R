workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          set -e

          rm -rf android lib assets pubspec.yaml README.md
          rm -rf /tmp/n_final
          mkdir -p /tmp/n_final

          unzip -o N_FINAL_RELEASE_GRADLE_FIXED.zip -d /tmp/n_final

          cp -r /tmp/n_final/android .
          cp -r /tmp/n_final/lib .
          cp -r /tmp/n_final/assets .
          cp /tmp/n_final/pubspec.yaml .
          cp /tmp/n_final/README.md .

      - name: Fix Android and Gradle configuration
        script: |
          set -e

          # -------------------------------------------------
          # settings.gradle
          # -------------------------------------------------
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream {
                      properties.load(it)
                  }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.11.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url "https://storage.googleapis.com/download.flutter.io"
                  }
              }
          }

          rootProject.name = "N"
          include ":app"
          EOF

          # -------------------------------------------------
          # gradle.properties
          # -------------------------------------------------
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

          # -------------------------------------------------
          # android/build.gradle
          # -------------------------------------------------
          cat > android/build.gradle <<'EOF'
          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # -------------------------------------------------
          # app/build.gradle
          # -------------------------------------------------
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.n.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.n.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          flutter {
              source "../.."
          }
          EOF

          # -------------------------------------------------
          # Gradle wrapper
          # -------------------------------------------------
          mkdir -p android/gradle/wrapper

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "===== FINAL SETTINGS ====="
          grep 'com.android.application' android/settings.gradle

          echo "===== FINAL GRADLE ====="
          grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Verify Android configuration
        script: |
          set -e

          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== gradle.properties ====="
          cat android/gradle.properties

          echo "===== gradle-wrapper.properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze Dart code
        script: |
          set -e
          flutter analyze

      - name: Build release APK
        script: |
          set -e
          flutter build apk --release
     artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
