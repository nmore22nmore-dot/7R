workflows:
n-android-release:
name: N Android Release
max_build_duration: 60
instance_type: mac_mini_m2

environment:
  flutter: stable
  groups:
    - N_SUPABASE

scripts:
  - name: Verify project
    script: |
      set -e

      test -f pubspec.yaml
      test -d lib
      test -d android

      echo "PROJECT STRUCTURE OK"

  - name: Flutter packages
    script: |
      set -e

      flutter clean
      flutter pub get

  - name: Flutter analyze
    script: |
      set -e

      flutter analyze

  - name: Build APK
    script: |
      set -e

      test -n "$SUPABASE_URL"
      test -n "$SUPABASE_PUBLISHABLE_KEY"

      flutter build apk --release \
        --dart-define=SUPABASE_URL="$SUPABASE_URL" \
        --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

  - name: Verify APK
    script: |
      set -e

      APK="build/app/outputs/flutter-apk/app-release.apk"

      test -f "$APK"

      echo "===== N APK CREATED SUCCESSFULLY ====="
      ls -lh "$APK"

artifacts:
  - build/app/outputs/flutter-apk/app-release.apk
