workflows:
  n_android_release:
    name: N Android Release
    instance_type: mac_mini_m2

    environment:
      groups:
        - N_SUPABASE
        - keystore_credentials
      vars:
        FLUTTER_VERSION: stable

    scripts:
      - name: Ensure Android project exists
        script: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.n .
          fi

      - name: Configure Android
        script: |
          # flutter_plugin_android_lifecycle now requires compileSdk 36+.
          # The generated Android project may default to 34, so force compileSdk 36.
          python3 - <<'PYCODE'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]
          found = False
          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              original = s
              # Groovy: compileSdk = flutter.compileSdkVersion / compileSdkVersion 34
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              # Kotlin DSL / explicit numeric values.
              import re
              s = re.sub(r"compileSdk(?:Version)?\s*=\s*34", "compileSdk = 36", s)
              s = re.sub(r"compileSdk(?:Version)?\s+34", "compileSdk 36", s)
              if s != original:
                  p.write_text(s)
                  found = True
          if not found:
              print("compileSdk was already 36+ or was not present in generated Gradle files")
          PYCODE

          mkdir -p android/app/src/main

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android project was not generated correctly"
            exit 1
          fi

          # Install N branding on the launcher icon generated by flutter create.
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "assets/branding/android/mipmap-$d/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp "assets/branding/android/mipmap-$d/ic_launcher.png" \
              "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

          # Required Android permissions for networking, media capture and upload.
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); perms=["<uses-permission android:name=\"android.permission.INTERNET\" />","<uses-permission android:name=\"android.permission.CAMERA\" />","<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />"]; marker="<application"; s=s if all(x in s for x in perms) else s.replace(marker, "\n".join(x for x in perms if x not in s)+"\n"+marker,1); p.write_text(s)'

          # Ensure the Android application name and launcher reference are N.
          sed -i.bak 's/android:label="[^"]*"/android:label="N"/' android/app/src/main/AndroidManifest.xml || true
          rm -f android/app/src/main/AndroidManifest.xml.bak

          # Register the Supabase auth callback used by email confirmation/password recovery.
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); b="<intent-filter>\n                <action android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <category android:name=\"android.intent.category.BROWSABLE\" />\n                <data android:scheme=\"n\" android:host=\"auth-callback\" />\n            </intent-filter>"; p.write_text(s.replace("</activity>", b+"\n        </activity>", 1) if "android:scheme=\"n\"" not in s else s)'

      - name: Flutter pub get
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/*.aab
