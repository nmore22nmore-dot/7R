workflows:
  n_android_release:
    name: N Android Release
    instance_type: mac_mini_m2

    environment:
      groups:
        - N_SUPABASE
        - keystore_credentials
      vars:
        FLUTTER_VERSION: stable

    scripts:
      - name: Ensure Android project exists
        script: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.n .
          fi

      - name: Configure Firebase Android
        script: |
          if [ ! -f firebase/google-services.json ]; then
            echo "ERROR: firebase/google-services.json is missing"
            exit 1
          fi

          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          settings = next((p for p in [Path("android/settings.gradle.kts"), Path("android/settings.gradle")] if p.exists()), None)
          app = next((p for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")] if p.exists()), None)
          if settings is None or app is None:
              raise SystemExit("ERROR: Android Gradle files not found")

          st = settings.read_text()
          if settings.suffix == ".kts":
              if "com.google.gms.google-services" not in st:
                  st = re.sub(
                      r'(plugins\\s*\\{)',
                      r'\\1\\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      st, count=1)
          else:
              if "com.google.gms.google-services" not in st:
                  st = re.sub(
                      r'(plugins\\s*\\{)',
                      r'\\1\\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      st, count=1)
          settings.write_text(st)

          ap = app.read_text()
          if "com.google.gms.google-services" not in ap:
              if app.suffix == ".kts":
                  ap = re.sub(r'(plugins\\s*\\{)', r'\\1\\n    id("com.google.gms.google-services")', ap, count=1)
              else:
                  ap = re.sub(r'(plugins\\s*\\{)', r'\\1\\n    id "com.google.gms.google-services"', ap, count=1)
          app.write_text(ap)
          print("Firebase Android configuration added")
          PYCODE

      - name: Configure Android
        script: |
          # file_picker and flutter_plugin_android_lifecycle require Android API 36.
          # Flutter's generated template may use flutter.compileSdkVersion, so replace
          # the app module's compileSdk reference explicitly after flutter create.
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          app_files = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          existing = [p for p in app_files if p.exists()]
          if not existing:
              raise SystemExit("ERROR: android/app/build.gradle(.kts) not found")

          for p in existing:
              lines = p.read_text().splitlines()
              out = []
              changed = False
              for line in lines:
                  if re.match(r'^\s*compileSdk(?:Version)?\s*(?:=\s*)?.*$', line):
                      indent = line[:len(line)-len(line.lstrip())]
                      key = "compileSdk" if p.suffix == ".kts" else "compileSdkVersion"
                      line = f"{indent}{key} = 36" if p.suffix == ".kts" else f"{indent}{key} 36"
                      changed = True
                  out.append(line)
              text = "\n".join(out) + "\n"
              # If the generated file has no compileSdk line, inject one in android {}.
              if not changed:
                  text, n = re.subn(r'(android\s*\{)', r'\1\n    compileSdk = 36', text, count=1)
                  changed = n > 0
              p.write_text(text)

          verify = "\n".join(p.read_text() for p in existing)
          if not re.search(r'compileSdk(?:Version)?\s*(?:=\s*|\s+)36\b', verify):
              raise SystemExit("ERROR: android app compileSdk is not 36")
          print("Android app compileSdk 36 configured successfully")
          for p in existing:
              print(p)
              for line in p.read_text().splitlines():
                  if "compileSdk" in line:
                      print("  ", line)
          PYCODE

          mkdir -p android/app/src/main

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android project was not generated correctly"
            exit 1
          fi

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "assets/branding/android/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp "assets/branding/android/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); perms=["<uses-permission android:name=\"android.permission.INTERNET\" />","<uses-permission android:name=\"android.permission.CAMERA\" />","<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />"]; marker="<application"; s=s if all(x in s for x in perms) else s.replace(marker, "\n".join(x for x in perms if x not in s)+"\n"+marker,1); p.write_text(s)'

          sed -i.bak 's/android:label="[^"]*"/android:label="N"/' android/app/src/main/AndroidManifest.xml || true
          rm -f android/app/src/main/AndroidManifest.xml.bak

          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); b="<intent-filter>\n                <action android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <category android:name=\"android.intent.category.BROWSABLE\" />\n                <data android:scheme=\"n\" android:host=\"auth-callback\" />\n            </intent-filter>"; p.write_text(s.replace("</activity>", b+"\n        </activity>", 1) if "android:scheme=\"n\"" not in s else s)'

      - name: Flutter pub get
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/*.aab
