workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Prepare project
        script: |
          set -e
          echo "===== N PROJECT ====="
          pwd
          ls -la
          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - name: Fix Android Gradle Plugin
        script: |
          set -e

          echo "===== CURRENT AGP ====="
          grep -R "com.android.application" android/settings.gradle 2>/dev/null || true

          if [ -f android/settings.gradle ]; then
            sed -i.bak "s/id 'com.android.application' version '[0-9.]*'/id 'com.android.application' version '8.11.1'/g" android/settings.gradle
            sed -i.bak 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.11.1"/g' android/settings.gradle
          fi

          echo "===== AGP AFTER FIX ====="
          grep -R "com.android.application" android/settings.gradle 2>/dev/null || true

      - name: Flutter packages
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Flutter analyze
        script: |
          set -e
          flutter analyze

      - name: Build APK
        script: |
          set -e
          flutter build apk --release

      - name: Verify APK
        script: |
          set -e
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "N APK CREATED SUCCESSFULLY"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
