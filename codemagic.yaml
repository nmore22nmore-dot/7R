workflows:
  n_android_release:
    name: N Android Release
    instance_type: mac_mini_m2
    environment:
      groups:
        - N_SUPABASE
        - keystore_credentials
      vars:
        FLUTTER_VERSION: stable
    scripts:
      - name: Ensure Android project exists
        script: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.n .
          fi
      - name: Configure Android
        script: |
          mkdir -p android/app/src/main
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Android project was not generated correctly"
            exit 1
          fi

          # Install N branding on the launcher icon generated by flutter create.
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "assets/branding/android/mipmap-$d/ic_launcher.png"               "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp "assets/branding/android/mipmap-$d/ic_launcher.png"               "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

          # Ensure the Android application name and launcher reference are N.
          sed -i.bak 's/android:label="[^"]*"/android:label="N"/' android/app/src/main/AndroidManifest.xml || true
          rm -f android/app/src/main/AndroidManifest.xml.bak

          # Release APKs need explicit Android Internet permission for Supabase/Auth/network calls.
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); perm="    <uses-permission android:name=\"android.permission.INTERNET\" />\n"; p.write_text(s if "android.permission.INTERNET" in s else s.replace("<application", perm+"    <application", 1))'

          # Register the Supabase auth callback used by email confirmation/password recovery.
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); b="<intent-filter>\n                <action android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <category android:name=\"android.intent.category.BROWSABLE\" />\n                <data android:scheme=\"n\" android:host=\"auth-callback\" />\n            </intent-filter>"; p.write_text(s.replace("</activity>", b+"\n        </activity>", 1) if "android:scheme=\"n\"" not in s else s)'


      - name: Flutter pub get
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/*.aab
