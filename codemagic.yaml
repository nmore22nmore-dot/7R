workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Set up Flutter local.properties
        script: |
          set -e

          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

          echo "===== local.properties ====="
          cat "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Flutter project
        script: |
          set -e

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Get Flutter packages
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Verify Flutter
        script: |
          set -e

          flutter --version
          flutter doctor -v

      - name: Analyze Dart
        script: |
          set -e

          flutter analyze

      - name: Build release APK
        script: |
          set -e

          flutter build apk --release

      - name: Verify APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "N APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
