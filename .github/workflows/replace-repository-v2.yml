name: Replace repository from N-app-ready ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and replace with N-app-ready.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="N-app-ready.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: $ZIP_NAME was not found in the repository root."
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          EXTRACT_DIR="$TMP_DIR/extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_NAME" -d "$EXTRACT_DIR"

          shopt -s dotglob nullglob
          entries=("$EXTRACT_DIR"/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SOURCE_DIR="${entries[0]}"
          else
            SOURCE_DIR="$EXTRACT_DIR"
          fi

          echo "Project source: $SOURCE_DIR"

          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name "$ZIP_NAME"             -exec rm -rf {} +

          cp -a "$SOURCE_DIR"/. .

          rm -f "$ZIP_NAME"
          rm -rf "$TMP_DIR"

          test -f pubspec.yaml
          test -d lib
          test -d supabase
          test -f codemagic.yaml

          echo "Flutter project structure verified successfully."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace repository with N app ready"
          git push
