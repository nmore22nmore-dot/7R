name: Replace repository with N Production Full

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository
        shell: bash
        run: |
          set -e

          ZIP="N-production-full-4.0.0.zip"

          test -f "$ZIP"

          rm -rf /tmp/n_full
          mkdir -p /tmp/n_full

          unzip -q "$ZIP" -d /tmp/n_full

          ROOT="/tmp/n_full"

          if [ -d "$ROOT/N_complete_release" ]; then
            ROOT="$ROOT/N_complete_release"
          fi

          test -f "$ROOT/pubspec.yaml"
          test -d "$ROOT/lib"
          test -d "$ROOT/android"

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          cp -a "$ROOT"/. .

          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Replace repository with N Production Full" || exit 0

          git push origin HEAD:main
