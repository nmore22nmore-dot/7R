name: Replace Repository Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and replace project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -100

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "Removing old repository files..."

          # حذف محتويات المستودع القديمة فقط
          # مع إبقاء .git و .github و extracted و ZIP مؤقتًا
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            ! -name "$(basename "$ZIP")" \
            -exec rm -rf {} +

          echo "Copying new project..."

          cp -a "$PROJECT_DIR"/. .

          echo "Removing temporary files..."

          rm -rf extracted
          rm -f "$ZIP"

          echo "Final repository contents:"
          find . -maxdepth 2 -not -path "./.git/*" -not -path "./.github/*"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Replace repository contents with latest ZIP"
            git push
          fi
