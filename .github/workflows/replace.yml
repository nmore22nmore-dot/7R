name: Replace Repository Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(find extracted -name "pubspec.yaml" -type f -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Flutter project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Remove old project
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$(basename "$ZIP")" \
            -exec rm -rf {} +

      - name: Copy new project
        run: |
          echo "Copying from:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Remove ZIP
        run: |
          rm -f "$ZIP"
          rm -rf extracted

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Replace all project files with new version"
            git push
          fi
