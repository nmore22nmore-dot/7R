name: N Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build N APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project
        run: |
          set -e

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Get dependencies
        run: |
          set -e

          flutter clean
          flutter pub get

      - name: Prepare Android signing
        env:
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -e

          echo "$CM_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/n-release.p12"

          test -s "$RUNNER_TEMP/n-release.p12"

          echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/n-release.p12" >> "$GITHUB_ENV"

          echo "Android signing keystore prepared successfully."

      - name: Verify Flutter
        run: |
          set -e

          flutter --version
          dart --version
          flutter doctor -v

      - name: Analyze Dart
        run: |
          set -e

          flutter analyze

      - name: Build release APK
        id: build_apk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --verbose 2>&1 | tee build.log

      - name: Show build error
        if: failure()
        run: |
          echo "======================================"
          echo "N BUILD ERROR DIAGNOSTICS"
          echo "======================================"

          if [ -f build.log ]; then
            echo "===== IMPORTANT ERRORS ====="

            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|Could not|error:|ERROR|Exception" \
              build.log | tail -100 || true

            echo "======================================"
            echo "===== LAST 150 LOG LINES ====="
            echo "======================================"

            tail -150 build.log
          else
            echo "build.log was not created."
          fi

      - name: Verify APK
        if: success()
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "N APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: N-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
