name: N Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build N APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project
        run: |
          set -e

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "PROJECT STRUCTURE OK"

      - name: Get dependencies
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: Analyze Dart
        run: |
          flutter analyze

      - name: Build release APK
        run: |
          set -e
          flutter build apk --release --verbose

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "===== N APK CREATED SUCCESSFULLY ====="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
