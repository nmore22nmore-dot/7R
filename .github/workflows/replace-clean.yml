name: Clean Replace N Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean and replace
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Repository files ==="
          ls -la

          ZIP="N-production-full-4.0.0.zip"

          echo "=== Checking ZIP ==="
          ls -lh "$ZIP"
          test -f "$ZIP"

          rm -rf /tmp/n_project
          mkdir -p /tmp/n_project

          echo "=== Extracting ZIP ==="
          unzip -q "$ZIP" -d /tmp/n_project

          echo "=== Extracted structure ==="
          find /tmp/n_project -maxdepth 3 -type f | head -100

          ROOT="/tmp/n_project"

          if [ -d "$ROOT/N_complete_release" ]; then
            ROOT="$ROOT/N_complete_release"
          fi

          echo "ROOT=$ROOT"

          echo "=== Checking Flutter project ==="
          test -f "$ROOT/pubspec.yaml"
          test -d "$ROOT/lib"
          test -d "$ROOT/android"

          echo "=== Cleaning repository ==="
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          echo "=== Copying new project ==="
          cp -a "$ROOT"/. .

          echo "=== Removing ZIP ==="
          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status --short

          git commit -m "Fix clean production replacement workflow" || true

          git push origin HEAD:main
