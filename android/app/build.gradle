plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.n.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.n.app"
        minSdk = 23
        targetSdk = 36
        versionCode = 2
        versionName = "2.0.0"
    }

    signingConfigs {
        release {
            if (System.getenv("CI")) {
                storeFile file(
                    System.getenv("CM_KEYSTORE_PATH")
                )
                storeType "PKCS12"
                storePassword System.getenv(
                    "CM_KEYSTORE_PASSWORD"
                )
                keyAlias System.getenv(
                    "CM_KEY_ALIAS"
                )
                keyPassword System.getenv(
                    "CM_KEY_PASSWORD"
                )
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source = "../.."
}
