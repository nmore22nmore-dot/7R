workflows:
  n-android-release:
    name: N Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Create clean Flutter project
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf n_build
          flutter create --platforms=android n_build

          rm -rf n_build/lib
          cp -R "$CM_BUILD_DIR/lib" n_build/lib

          cp "$CM_BUILD_DIR/pubspec.yaml" n_build/pubspec.yaml

          cd n_build
          flutter pub get

      - name: Analyze Dart code
        script: |
          cd "$CM_BUILD_DIR/n_build"
          flutter analyze

      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/n_build"
          flutter build apk --release

    artifacts:
      - n_build/build/app/outputs/flutter-apk/app-release.apk
